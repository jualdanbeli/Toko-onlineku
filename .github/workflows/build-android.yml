name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pnpm install --frozen-lockfile

      - working-directory: artifacts/jualdanbeli
        run: pnpm run build

      - working-directory: artifacts/jualdanbeli
        run: pnpm exec cap sync android

      - working-directory: artifacts/jualdanbeli/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jualdanbeli-debug-apk
          path: artifacts/jualdanbeli/android/app/build/outputs/apk/debug/app-debug.apk
